services:
  postgres:
    image: postgres:16
    container_name: ai-recruitment-email-assistant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_recruitment_email_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_recruitment_email_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

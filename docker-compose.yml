services:
  postgres:
    image: postgres:16
    container_name: ai-recruitment-email-assistant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1162004"
      POSTGRES_DB: HiLab_Email
    ports:
      - "5433:5432"
    volumes:
      - hilab_email_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HiLab_Email"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ai-recruitment-email-assistant-api
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:1162004@postgres:5432/HiLab_Email
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS:-onboarding@resend.dev}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-Recruitment Team}
      RESEND_CONNECT_TIMEOUT_SECONDS: 5
      RESEND_READ_TIMEOUT_SECONDS: 10
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    container_name: ai-recruitment-email-assistant-web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hilab_email_postgres_data:
